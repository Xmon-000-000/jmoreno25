---
apiVersion: v1
kind: Pod
metadata:
  name: api-test
  namespace: net-lab
spec:
  serviceAccountName: reader
  containers:
  - name: test
    image: nicolaka/netshoot
    command: ["sh","-c","sleep 3600"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reader
  namespace: net-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: net-lab
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
  namespace: net-lab
subjects:
- kind: ServiceAccount
  name: reader
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io

