---
apiVersion: v1
kind: Pod
metadata:
  name: backend-a
  namespace: net-exam
  labels:
    role: backend
    app: a
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: backend-b
  namespace: net-exam
  labels:
    role: backend
    app: b
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-a
  namespace: net-exam
  labels:
    role: frontend
    app: a
spec:
  containers:
  - name: curl
    image: curlimages/curl
    command: ["sh","-c","sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-b
  namespace: net-exam
  labels:
    role: frontend
    app: b
spec:
  containers:
  - name: curl
    image: curlimages/curl
    command: ["sh","-c","sleep 3600"]
