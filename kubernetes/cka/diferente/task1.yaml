---
apiVersion: v1
kind: Namespace
metadata:
  name: taint-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: infra-pod
  namespace: taint-lab
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
  tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "infra"
    effect: "NoSchedule"  
