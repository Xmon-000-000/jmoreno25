---
apiVersion: v1
kind: Namespace
metadata:
  name: pdb-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pdb-lab
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
  namespace: pdb-lab
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nginx
