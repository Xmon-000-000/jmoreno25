apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app
  namespace: final-lab
spec:
  serviceName: app
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: app
              topologyKey: kubernetes.io/hostname
      containers:
      - name: app
        image: busybox
        command:
        - sh
        - -c
        - |
          echo "Starting $(hostname)"
          while true; do
            echo "$(hostname) $(date)" >> /data/data.txt
            sleep 5
          done
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
