---
apiVersion: v1
kind: Namespace
metadata:
  name: rbac-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: rbac-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: rbac-lab
  name: pod-reader
rules:
- apiGroups: [""]
  resources: ["pods","services"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: rbac-lab
subjects:
- kind: ServiceAccount
  name: app-sa
roleRef:
  kind: Role
  name: pod-reader
---
apiVersion: v1
kind: Pod
metadata:
  name: reader
  namespace: rbac-lab
spec:
  serviceAccountName: app-sa
  containers:
  - name: busybox
    image: busybox:1.36
    command: ["sh","-c","while true; do sleep 100; done;"]
    ports:
    - containerPort: 80