---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: netops
  labels:
    tier: backend
    app: api
spec:
  containers:
  - name: api
    image: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: netops
spec:
  selector:
    app: apii   # <- ERROR SUTIL
  ports:
  - port: 80
    targetPort: 80
