---
apiVersion: v1
kind: Namespace
metadata:
  name: env-exam
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-cm
  namespace: env-exam
data:
  MODE: standart
---
apiVersion: v1
kind: Pod
metadata:
  name: env-pod
  namespace: env-exam
spec:
  containers:
  - name: nginx
    image: nginx:1.14.2
    ports:
    - containerPort: 80
    command: ["sh","-c","echo $MODE;"]
    volumeMounts:
    - name: foo
      mountPath: "/etc/foo"
  volumes:
  - name: foo
    configMap:
      name: app-cm
