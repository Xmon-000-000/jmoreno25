---
apiVersion: v1
kind: Namespace
metadata:
  name: bool-exam
---
apiVersion: v1
kind: Pod
metadata:
  name: bool-pod
  namespace: bool-exam
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 2000
    fsGroup: 3000
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 8080
    command: ["sh","-c","while true; do sleep 100; done"]
    securityContext:
      allowPrivilegeEscalation: false
