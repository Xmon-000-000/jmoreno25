---
apiVersion: v1
kind: Namespace
metadata:
  name: exam-core
---
apiVersion: v1
kind: Pod
metadata:
  name: sleepy
  namespace: exam-core
spec:
  containers:
  - name: nginx
    image: busybox:1.36
    ports:
    - containerPort: 80
    command: ["sh","-c","while true; do sleep 100; done"]
---
apiVersion: v1
kind: Pod
metadata:
  name: web-health
  namespace: exam-core
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    ports:
    - containerPort: 80
    command: ["sh","-c","nginx -g 'daemon off;'; while true; do sleep 10; echo $MODE; done"]
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 15
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 15
      periodSeconds: 10
    env:
      - name: MODE
        valueFrom:
          configMapKeyRef:
            name: exam-config
            key: MODE
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: exam-config
  namespace: exam-core
data:
  MODE: exam
