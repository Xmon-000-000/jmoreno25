---
apiVersion: v1
kind: Namespace
metadata:
  name: node-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: node-bound
  namespace: node-lab
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: disk
            operator: In
            values: ssd
  containers:
  - name: nginx
    image: nginx:1.14.2
    ports:
    - containerPort: 80
