---
apiVersion: v1
kind: Namespace
metadata:
  name: quota-lab
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: rq-small
  namespace: quota-lab
spec:
  hard:
    pods: "3"
    limits.cpu: "500m"
    limits.memory: "512Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  namespace: quota-lab
spec:
  containers:
  - name: demo
    image: registry.k8s.io/pause:3.8
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
