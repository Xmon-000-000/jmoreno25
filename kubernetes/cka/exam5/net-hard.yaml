---
apiVersion: v1
kind: Pod
metadata:
  name: backend-a
  namespace: net-hard
  labels:
    role: backend
    app: a
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: backend-a
  namespace: net-hard
spec:
  selector:
    role: backend
    app: a
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: backend-b
  namespace: net-hard
  labels:
    role: backend
    app: b
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: backend-b
  namespace: net-hard
spec:
  selector:
    role: backend
    app: b
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-a
  namespace: net-hard
  labels:
    role: frontend
    app: a
spec:
  containers:
  - name: curl
    image: curlimages/curl
    command: ["sh","-c","sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-b
  namespace: net-hard
  labels:
    role: frontend
    app: b
spec:
  containers:
  - name: curl
    image: curlimages/curl
    command: ["sh","-c","sleep 3600"]
