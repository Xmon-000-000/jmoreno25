---
apiVersion: v1
kind: Namespace
metadata:
  name: topology-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zone-app
  namespace: topology-lab
  labels:
    app: nginx
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: 
            app: nginx
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
