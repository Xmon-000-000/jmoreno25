---
apiVersion: v1
kind: Namespace
metadata:
  name: gc-lab
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pi
  namespace: gc-lab
spec:
  template:
    spec:
      containers:
      - name: pi
        image: perl:5.34.0
        command: ["perl",  "-Mbignum=bpi", "-wle", "print bpi(2000)"]
      restartPolicy: Never
