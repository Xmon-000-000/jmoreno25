---
apiVersion: v1
kind: Namespace
metadata:
  name: affinity-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-app
  namespace: affinity-lab
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
