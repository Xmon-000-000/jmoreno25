---
apiVersion: v1
kind: Namespace
metadata:
  name: selector-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: selector-lab
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: selector-lab
spec:
  selector:
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9376
