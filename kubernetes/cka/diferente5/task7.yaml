---
apiVersion: v1
kind: Namespace
metadata:
  name: cka-e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer
  namespace: cka-e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: cka-e
  name: pod-reader
rules:
- apiGroups: [""] 
  resources: ["pods"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
  namespace: cka-e
subjects:
- kind: ServiceAccount
  name: viewer
roleRef:
  kind: Role 
  name: pod-reader 
  apiGroup: rbac.authorization.k8s.io
