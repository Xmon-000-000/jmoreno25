---
apiVersion: v1
kind: Namespace
metadata:
  name: imp-full
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-sa
  namespace: imp-full
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: imp-full
  name: pod-auditor
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-auditor-binding
  namespace: imp-full
subjects:
- kind: ServiceAccount 
  name: audit-sa
roleRef:
  kind: Role 
  name: pod-auditor
  apiGroup: rbac.authorization.k8s.io