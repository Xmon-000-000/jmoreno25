---
apiVersion: v1
kind: Namespace
metadata:
  name: weird-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: weird-app
data:
  index.html: |
    <h1>HELLO FROM CONFIGMAP</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: weird-app
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsUser: 1000
      containers:
      - name: nginx
        image: nginx:1.25
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /usr/share/nginx/html
        - name: cache
          mountPath: /var/cache/nginx/
        - name: run
          mountPath: /var/run/
        readinessProbe:
          httpGet:
            path: /
            port: 80
      volumes:
      - name: config
        configMap:
          name: web-config
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: weird-app
spec:
  selector:
    app: web
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: tester
  namespace: weird-app
spec:
  containers:
  - name: debug
    image: nicolaka/netshoot
    command: ["sh","-c","sleep 3600"]
