---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: network
  labels:
    app: backend
spec:
  containers:
  - name: nginx
    image: nginx
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: network
  labels:
    app: client
spec:
  containers:
  - name: busybox
    image: busybox
    command: ["sh","-c","sleep 3600"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: network
spec:
  podSelector:
    matchLabels:
      app: client
  policyTypes:
  - Ingress

