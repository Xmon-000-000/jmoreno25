---
apiVersion: v1
kind: Namespace
metadata:
  name: test-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: prod-ns
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: dynamic-delete
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Delete
volumeBindingMode: Immediate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: dynamic-retain
provisioner: k8s.io/minikube-hostpath
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc
  namespace: test-ns
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: dynamic-delete
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prod-pvc
  namespace: prod-ns
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: dynamic-retain
  resources:
    requests:
      storage: 1Gi
