---
apiVersion: v1
kind: Namespace
metadata:
  name: ops-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-sa
  namespace: ops-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ops-lab
  name: role-ops
rules:
- apiGroups: [""] 
  resources: ["pods"]
  verbs: ["get", "watch", "list","create","delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-bind
  namespace: ops-lab
subjects:
- kind: ServiceAccount
  name: ops-sa
  apiGroup: ""
roleRef:
  kind: Role 
  name: role-ops
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: job-config
  namespace: ops-lab
data:
  TARGET_URL: http://example.com
---
apiVersion: batch/v1
kind: Job
metadata:
  name: http-check
  namespace: ops-lab
spec:
  template:
    spec:
      containers:
      - name: http-check
        image: busybox
        command: ["sh","-c","for i in {1..5}; do sleep 2; wget -qO- $TARGET_URL; done"]
        env:
          - name: TARGET_URL
            valueFrom:
              configMapKeyRef:
                name: job-config
                key: TARGET_URL
      restartPolicy: Never
---
apiVersion: v1
kind: LimitRange
metadata:
  name: limit-ops
  namespace: ops-lab
spec:
  limits:
  - default: 
      cpu: 300m
      memory: 256Mi
    defaultRequest: 
      cpu: 100m
      memory: 128Mi
    type: Container
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quota-ops-lab
  namespace: ops-lab
spec:
  hard:
    pods: "5"
    limits.cpu: "2"
    limits.memory: "2Gi"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: ops-lab
  labels:
    daemon: all
spec:
  selector:
    matchLabels:
      name: node-agent
  template:
    metadata:
      labels:
        name: node-agent
    spec:
      tolerations:
      - key: dedicated
        operator: Exists
        effect: NoSchedule
      containers:
      - name: mi-daemon
        image: busybox
        command: ["sh","-c","sleep 3600;"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ops-lab
  labels:
    app: daemon
spec:
  replicas: 2
  selector:
    matchLabels:
      app: daemon
  template:
    metadata:
      labels:
        app: daemon
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: ops-lab
spec:
  selector:
    app: daemon
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
